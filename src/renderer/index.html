<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>ReciteFlow</title>
    <link rel="stylesheet" href="./design/tokens.css" />
    <link rel="stylesheet" href="./design/components.css" />
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <symbol id="i-play" viewBox="0 0 16 16"><path class="icon-fill" d="M4.5 2.6v10.8c0 .8.9 1.3 1.6.9l8.3-5.4c.6-.4.6-1.3 0-1.7L6.1 1.7c-.7-.4-1.6.1-1.6.9Z" /></symbol>
      <symbol id="i-stop" viewBox="0 0 16 16"><rect class="icon-fill" x="3" y="3" width="10" height="10" rx="2" /></symbol>
      <symbol id="i-mic" viewBox="0 0 16 16"><rect x="5.5" y="1.5" width="5" height="8" rx="2.5" /><path d="M3 7.5a5 5 0 0 0 10 0M8 12.5v2" /></symbol>
      <symbol id="i-down" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4" /></symbol>
      <symbol id="i-again" viewBox="0 0 16 16"><path d="M2.5 8a5.5 5.5 0 1 0 1.7-4" /><path d="M2.5 1.8v3h3" /></symbol>
      <symbol id="i-edit" viewBox="0 0 16 16"><path d="M10.5 2.5l3 3L6 13H3v-3z" /></symbol>
      <symbol id="i-check" viewBox="0 0 16 16"><path d="M3 8.5l3 3 7-7" /></symbol>
      <symbol id="i-cross" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" /></symbol>
      <symbol id="i-gear" viewBox="0 0 16 16"><path d="M2 4.5h7M12.5 4.5H14M2 11.5h1.5M7 11.5h7" /><circle cx="10.75" cy="4.5" r="1.75" /><circle cx="5.25" cy="11.5" r="1.75" /></symbol>
      <symbol id="i-back" viewBox="0 0 16 16"><path d="M10 3.5L5.5 8l4.5 4.5" /></symbol>
    </svg>

    <main class="app">
      <header class="top">
        <h1 class="title">ReciteFlow</h1>
        <div class="top-right">
          <span class="status" id="status" role="status"></span>
          <button class="btn btn-icon" id="open-settings" aria-label="Settings" title="Settings"><svg class="icon"><use href="#i-gear" /></svg></button>
        </div>
      </header>
      <div class="sub">
        <p class="hint" id="hint"></p>
        <span class="light" id="engine" data-state="starting">Starting the engine...</span>
      </div>

      <div class="message" id="message" data-tone="bad" role="alert" hidden>
        <span class="mark mark-bad"><svg class="icon"><use href="#i-cross" /></svg></span>
        <p id="message-text"></p>
        <button class="btn btn-quiet btn-small" id="again" hidden>Start again</button>
      </div>
      <div class="message" id="history-off" data-tone="wait" role="status" hidden>
        <span class="mark mark-wait">!</span>
        <p>History is off (could not open data/history.db). Recitations are not saved.</p>
      </div>

      <textarea class="field" id="text" spellcheck="false" aria-label="Text to recite"
        placeholder="Paste the text you want to recite"></textarea>
      <section class="page reciting" id="page" data-phase="edit" aria-label="Your recitation" hidden>
        <div class="scroll" id="scroll"><p class="words" id="words"></p></div>
        <ul class="tally" id="tally" aria-label="Counters"></ul>
        <div class="menu" id="menu" role="menu" aria-label="Correct this word" hidden></div>
      </section>
      <section class="settings" id="settings" aria-labelledby="settings-title" hidden>
        <h2 class="settings-title" id="settings-title">Settings</h2>
        <div class="setting">
          <div>
            <p class="setting-name" id="theme-name">Theme</p>
            <p class="hint">Windows follows the light or dark mode set in Windows.</p>
          </div>
          <div class="seg" id="theme" role="radiogroup" aria-labelledby="theme-name">
            <button role="radio" data-theme-pick="system">Windows</button>
            <button role="radio" data-theme-pick="light">Light</button>
            <button role="radio" data-theme-pick="dark">Dark</button>
          </div>
        </div>
      </section>

      <div class="bar" id="options">
        <label class="option"><input type="checkbox" class="switch" id="hide" checked /> Hide the text while I recite</label>
        <label class="option"><input type="checkbox" class="switch" id="beep" checked /> Beep on a mistake</label>
      </div>
      <div class="bar" id="actions">
        <label class="picker"><svg class="icon"><use href="#i-mic" /></svg>
          <select id="mic" aria-label="Microphone"><option value="">Default microphone</option></select>
          <svg class="icon"><use href="#i-down" /></svg></label>
        <label class="option"><input type="checkbox" class="switch" id="keep" /> Keep my recordings for training</label>
        <span class="grow"></span>
        <div class="end">
          <button class="btn btn-quiet" id="edit" hidden><svg class="icon"><use href="#i-edit" /></svg>Edit text</button>
          <button class="btn btn-go" id="go" disabled><svg class="icon"><use href="#i-play" /></svg>Start</button>
        </div>
      </div>
      <div class="bar" id="settings-bar" hidden>
        <span class="grow"></span>
        <button class="btn btn-quiet" id="close-settings"><svg class="icon"><use href="#i-back" /></svg>Back</button>
      </div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
